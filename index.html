<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tischtennis Jonglier-Counter</title>
<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#38bdf8;
    --accent2:#22c55e;
    --text:#f8fafc;
    --muted:#94a3b8;
}
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}
body{
    background:linear-gradient(135deg,#020617,#0f172a);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.container{
    width:100%;
    max-width:700px;
}
.card{
    background:rgba(30,41,59,.9);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}
h1{
    text-align:center;
    margin-bottom:20px;
    font-size:2rem;
}
.counter{
    text-align:center;
    font-size:6rem;
    font-weight:800;
    color:var(--accent);
    margin:20px 0;
}
.status{
    text-align:center;
    color:var(--muted);
    margin-bottom:15px;
}
.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:20px;
}
button{
    border:none;
    border-radius:16px;
    padding:16px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
}
.start{
    background:var(--accent2);
    color:white;
}
.stop{
    background:#ef4444;
    color:white;
}
.reset{
    background:#334155;
    color:white;
    grid-column:span 2;
}
.section{
    margin-top:20px;
}
label{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    font-size:.95rem;
}
input[type=range]{
    width:100%;
    margin-bottom:20px;
}
.meterWrap{
    background:#0f172a;
    border-radius:14px;
    overflow:hidden;
    height:26px;
}
.meter{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22c55e,#38bdf8);
    transition:width .05s linear;
}
.info{
    margin-top:18px;
    color:var(--muted);
    font-size:.9rem;
    line-height:1.5;
}
.hitFlash{
    animation:flash .15s ease;
}
@keyframes flash{
    from{transform:scale(1.08);}
    to{transform:scale(1);}
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🏓 Jonglier Counter</h1>
<div class="counter" id="counter">0</div>
<div class="status" id="status">
Bereit
</div>
<div class="controls">
<button class="start" id="startBtn">
🎤 Start
</button>
<button class="stop" id="stopBtn">
⏹ Stop
</button>
<button class="reset" id="resetBtn">
🔄 Reset
</button>
</div>
<div class="section">
<label>
<span>Empfindlichkeit</span>
<span id="sensitivityValue">1.5</span>
</label>
<label>
<span>Schwelle</span>
<span id="thresholdValue">30</span>
</label>
<label>
<span>Mindestabstand (ms)</span>
<span id="cooldownValue">120</span>
</label>
</div>
<div class="section">
<label>
<span>Aktuelle Lautstärke</span>
<span id="volumeText">0</span>
</label>
<div class="meterWrap">
<div class="meter" id="meter"></div>
</div>
</div>
<div class="info">
Tipp: Stelle das iPhone 30–80 cm entfernt auf. <br>
Falls doppelt gezählt wird, erhöhe den Mindestabstand. <br>
Falls Treffer fehlen, erhöhe die Empfindlichkeit oder senke die Schwelle.
</div>
</div>
</div>
<script>
let audioContext;
let analyser;
let microphone;
let dataArray;
let animationFrame;
let running = false;
let count = 0;
let lastHitTime = 0;
let previousVolume = 0;
const counter = document.getElementById("counter");
const meter = document.getElementById("meter");
const volumeText = document.getElementById("volumeText");
const statusText = document.getElementById("status");
const thresholdSlider = document.getElementById("threshold");
const sensitivitySlider = document.getElementById("sensitivity");
const cooldownSlider = document.getElementById("cooldown");
function updateLabels(){
    document.getElementById("thresholdValue").textContent =
        thresholdSlider.value;
    document.getElementById("sensitivityValue").textContent =
        sensitivitySlider.value;
    document.getElementById("cooldownValue").textContent =
        cooldownSlider.value;
}
updateLabels();
thresholdSlider.oninput = updateLabels;
sensitivitySlider.oninput = updateLabels;
cooldownSlider.oninput = updateLabels;
async function startListening(){
    if(running) return;
    try{
        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });
        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();
        analyser =
            audioContext.createAnalyser();
        analyser.fftSize = 512;
        microphone =
            audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        dataArray =
            new Uint8Array(analyser.frequencyBinCount);
        running = true;
        statusText.textContent =
            "🎧 Mikrofon aktiv";
        detectHits();
    }catch(err){
        statusText.textContent =
            "❌ Mikrofon-Zugriff verweigert";
        console.error(err);
    }
}
function stopListening(){
    running = false;
    if(animationFrame){
        cancelAnimationFrame(animationFrame);
    }
    if(audioContext){
        audioContext.close();
    }
    statusText.textContent =
        "Gestoppt";
}
function detectHits(){
    if(!running) return;
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for(let i=0;i<dataArray.length;i++){
        sum += dataArray[i];
    }
    let volume =
        sum / dataArray.length;
    const sensitivity =
        parseFloat(
            sensitivitySlider.value
        );
    volume *= sensitivity;
    volumeText.textContent =
        volume.toFixed(0);
    meter.style.width =
        Math.min(volume,100) + "%";
    const threshold =
        parseFloat(
            thresholdSlider.value
        );
    const cooldown =
        parseInt(
            cooldownSlider.value
        );
    const now = Date.now();
    const risingEdge =
        volume > threshold &&
        volume > previousVolume * 1.15;
    if(
        risingEdge &&
        now - lastHitTime > cooldown
    ){
        count++;
        counter.textContent = count;
        counter.classList.add("hitFlash");
        setTimeout(()=>{
            counter.classList.remove("hitFlash");
        },150);
        lastHitTime = now;
    }
    previousVolume = volume;
    animationFrame =
        requestAnimationFrame(
            detectHits
        );
}
document
.getElementById("startBtn")
.addEventListener(
"click",
startListening
);
document
.getElementById("stopBtn")
.addEventListener(
"click",
stopListening
);
document
.getElementById("resetBtn")
.addEventListener(
"click",
()=>{
    count = 0;
    counter.textContent = "0";
}
);
</script>
</body>
</html>
