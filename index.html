<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jonglier-Zähler Kamera</title>
  <style>
    :root { --bg:#06070c; --card:#171923; --muted:#9aa0aa; --green:#34c759; --yellow:#ffd60a; --red:#ff453a; --blue:#0a84ff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:white; text-align:center; padding:14px; }
    h1 { font-size:86px; line-height:1; margin:10px 0; }
    h2 { margin:8px 0; }
    button { font-size:17px; padding:12px 16px; margin:5px; border:0; border-radius:14px; font-weight:800; }
    .start { background:var(--green); } .stop { background:var(--red); color:white; } .reset { background:var(--yellow); } .blue { background:var(--blue); color:white; }
    .grid { display:grid; gap:12px; max-width:820px; margin:0 auto; }
    .box { background:var(--card); border-radius:18px; padding:12px; }
    .small { color:var(--muted); font-size:13px; }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#252837; color:#ddd; font-size:13px; margin:3px; }
    .good { background:rgba(52,199,89,.22); color:#a8ffbd; }
    .bad { background:rgba(255,69,58,.18); color:#ffb4ae; }
    .row { display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; }
    .stage { position:relative; width:100%; max-width:760px; margin:0 auto; border-radius:18px; overflow:hidden; background:#000; }
    video, canvas { width:100%; display:block; }
    #overlay { position:absolute; inset:0; }
    input[type="range"] { width:100%; max-width:460px; }
  </style>
</head>
<body>
  <h2>⚽ Kamera-Jonglier-Zähler</h2>
  <h1 id="count">0</h1>

  <div class="row">
    <button class="blue" id="camera">Kamera starten</button>
    <button class="blue" id="sample">Ball-Farbe lernen</button>
    <button class="start" id="start">Zählen starten</button>
    <button class="stop" id="stop">Stop</button>
    <button class="reset" id="reset">Reset</button>
  </div>

  <div class="grid">
    <div class="box">
      <span id="status" class="pill">Bereit</span>
      <span id="track" class="pill">Ball nicht gelernt</span>
      <span id="direction" class="pill">Richtung: --</span>
      <p class="small">Handy seitlich aufstellen. Tippe auf „Ball-Farbe lernen“ und dann im Videobild auf den Ball. Danach „Zählen starten“.</p>
    </div>

    <div class="stage">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="box">
      <label>Farb-Toleranz: <b id="tolLabel">55</b></label><br>
      <input id="tolerance" type="range" min="20" max="120" value="55">
      <br><br>
      <label>Zähllinie Höhe: <b id="lineLabel">55%</b></label><br>
      <input id="lineY" type="range" min="30" max="80" value="55">
      <p class="small">Wenn er Bodenkontakte zählt: Zähllinie höher setzen. Wenn er Ballkontakte verpasst: Toleranz erhöhen.</p>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const video = $('video');
const overlay = $('overlay');
const ctx = overlay.getContext('2d', { willReadFrequently:true });

let stream = null;
let running = false;
let sampling = false;
let count = 0;
let targetColor = null;
let lastY = null;
let lastDirection = null;
let lastCrossTime = 0;
let ballSeenFrames = 0;
let lostFrames = 0;

$('reset').onclick = () => { count = 0; $('count').textContent = count; };
$('stop').onclick = () => { running = false; $('status').textContent = 'Gestoppt'; $('status').className = 'pill'; };
$('camera').onclick = startCamera;
$('sample').onclick = () => { sampling = true; $('status').textContent = 'Tippe im Bild auf den Ball'; $('status').className = 'pill good'; };
$('start').onclick = () => {
  if (!targetColor) { alert('Bitte zuerst Ball-Farbe lernen.'); return; }
  count = 0;
  $('count').textContent = count;
  running = true;
  lastY = null;
  lastDirection = null;
  lastCrossTime = 0;
  $('status').textContent = 'Zählt';
  $('status').className = 'pill good';
};
$('tolerance').oninput = () => $('tolLabel').textContent = $('tolerance').value;
$('lineY').oninput = () => $('lineLabel').textContent = $('lineY').value + '%';

async function startCamera(){
  stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: 'environment',
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  resizeCanvas();
  $('status').textContent = 'Kamera läuft';
  $('status').className = 'pill good';
  requestAnimationFrame(loop);
}

function resizeCanvas(){
  overlay.width = video.videoWidth || 640;
  overlay.height = video.videoHeight || 480;
}

overlay.addEventListener('click', e => {
  if (!sampling) return;
  const rect = overlay.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) / rect.width * overlay.width);
  const y = Math.round((e.clientY - rect.top) / rect.height * overlay.height);

  ctx.drawImage(video, 0, 0, overlay.width, overlay.height);
  const patch = ctx.getImageData(Math.max(0,x-4), Math.max(0,y-4), 9, 9).data;
  let r=0,g=0,b=0,n=0;
  for(let i=0;i<patch.length;i+=4){ r+=patch[i]; g+=patch[i+1]; b+=patch[i+2]; n++; }
  targetColor = { r:r/n, g:g/n, b:b/n };
  sampling = false;
  $('track').textContent = `Ball gelernt RGB ${Math.round(targetColor.r)},${Math.round(targetColor.g)},${Math.round(targetColor.b)}`;
  $('track').className = 'pill good';
  $('status').textContent = 'Ball gelernt';
});

function loop(){
  if (!video.videoWidth) { requestAnimationFrame(loop); return; }
  if (overlay.width !== video.videoWidth) resizeCanvas();

  ctx.drawImage(video, 0, 0, overlay.width, overlay.height);

  const w = overlay.width, h = overlay.height;
  const lineY = h * Number($('lineY').value) / 100;
  let ball = null;

  if (targetColor) ball = findBall(w, h);

  drawOverlay(ball, lineY);

  if (running && ball) updateCounter(ball, lineY);

  requestAnimationFrame(loop);
}

function findBall(w, h){
  const scale = 4; // jedes 4. Pixel prüfen, schneller fürs Handy
  const data = ctx.getImageData(0, 0, w, h).data;
  const tol = Number($('tolerance').value);

  let sumX=0, sumY=0, countPx=0;
  let minX=w, minY=h, maxX=0, maxY=0;

  for(let y=0; y<h; y+=scale){
    for(let x=0; x<w; x+=scale){
      const i = (y*w + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];

      // Farbvergleich normalisiert: funktioniert besser bei Schatten/Lichtwechseln.
      const br = r + g + b + 1;
      const tr = targetColor.r + targetColor.g + targetColor.b + 1;
      const nr = r/br, ng = g/br, nb = b/br;
      const trr = targetColor.r/tr, tg = targetColor.g/tr, tb = targetColor.b/tr;
      const colorDist = Math.sqrt((nr-trr)**2 + (ng-tg)**2 + (nb-tb)**2) * 255;
      const rawDist = Math.sqrt((r-targetColor.r)**2 + (g-targetColor.g)**2 + (b-targetColor.b)**2);

      if (colorDist < tol/2.2 && rawDist < tol*2.8) {
        sumX += x; sumY += y; countPx++;
        if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
      }
    }
  }

  if (countPx < 12) {
    lostFrames++;
    ballSeenFrames = 0;
    $('track').textContent = 'Ball verloren';
    $('track').className = 'pill bad';
    return null;
  }

  ballSeenFrames++;
  lostFrames = 0;
  const cx = sumX / countPx;
  const cy = sumY / countPx;
  const bw = maxX - minX;
  const bh = maxY - minY;
  const size = Math.max(bw,bh);
  $('track').textContent = `Ball erkannt · Größe ${Math.round(size)}`;
  $('track').className = 'pill good';
  return { x:cx, y:cy, size, pixels:countPx, minX, minY, maxX, maxY };
}

function updateCounter(ball, lineY){
  const now = performance.now();
  if (lastY === null) { lastY = ball.y; return; }

  const dy = ball.y - lastY;
  const direction = dy > 2 ? 'runter' : dy < -2 ? 'hoch' : lastDirection;
  $('direction').textContent = 'Richtung: ' + (direction || '--');

  // Gezählt wird, wenn der Ball von unten nach oben durch die Linie geht.
  // Das entspricht meistens dem Moment nach dem Fußkontakt.
  const crossedUp = lastY > lineY && ball.y <= lineY;
  const stableTrack = ballSeenFrames >= 3;
  const notTooSoon = now - lastCrossTime > 280;
  const movingUp = direction === 'hoch';

  if (crossedUp && movingUp && stableTrack && notTooSoon) {
    count++;
    $('count').textContent = count;
    lastCrossTime = now;
    if (navigator.vibrate) navigator.vibrate(18);
  }

  lastY = ball.y;
  lastDirection = direction;
}

function drawOverlay(ball, lineY){
  const w = overlay.width, h = overlay.height;

  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(10,132,255,.95)';
  ctx.beginPath();
  ctx.moveTo(0,lineY);
  ctx.lineTo(w,lineY);
  ctx.stroke();

  ctx.fillStyle = 'rgba(10,132,255,.95)';
  ctx.font = '28px system-ui';
  ctx.fillText('Zähllinie', 18, lineY - 12);

  if (ball) {
    ctx.strokeStyle = 'rgba(52,199,89,.95)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, Math.max(16, ball.size/2), 0, Math.PI*2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(52,199,89,.95)';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 6, 0, Math.PI*2);
    ctx.fill();
  }
}
</script>
</body>
</html>
