<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏓 Tischtennis Jonglier-Counter</title>
<style>
:root{
  --bg:#08111f;
  --card:#132238;
  --text:#f5f7fb;
  --muted:#9fb0c7;
  --accent:#4cc9f0;
  --success:#4ade80;
  --danger:#ef4444;
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(180deg,#07101d,#132238);
  color:var(--text);
  min-height:100vh;
  padding:20px;
}
.wrapper{
  max-width:800px;
  margin:auto;
}
.card{
  background:var(--card);
  border-radius:24px;
  padding:24px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}
h1{
  text-align:center;
  margin-bottom:20px;
}
.counter{
  text-align:center;
  font-size:96px;
  font-weight:800;
  color:var(--accent);
  margin:10px 0;
}
.highscore{
  text-align:center;
  color:var(--muted);
  margin-bottom:20px;
}
.status{
  text-align:center;
  margin-bottom:20px;
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
button{
  border:none;
  border-radius:16px;
  padding:18px;
  font-size:18px;
  font-weight:700;
}
.start{
  background:var(--success);
}
.stop{
  background:var(--danger);
  color:white;
}
.reset{
  margin-top:12px;
  width:100%;
  background:#32445e;
  color:white;
}
.section{
  margin-top:28px;
}
label{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}
input[type=range]{
  width:100%;
  height:40px;
}
.meter-bg{
  height:28px;
  background:#08111f;
  border-radius:14px;
  overflow:hidden;
}
.meter{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#4ade80,#4cc9f0);
}
.tip{
  margin-top:20px;
  color:var(--muted);
  line-height:1.5;
}
</style>
</head>
<body>
<div class="wrapper">
<div class="card">
<h1>🏓 Jonglier Counter</h1>
<div class="counter" id="count">0</div>
<div class="highscore">
Highscore: <span id="highscore">0</span>
</div>
<div class="status" id="status">
Bereit
</div>
<div class="buttons">
<button class="start" id="startBtn">🎤 Start</button>
<button class="stop" id="stopBtn">⏹ Stop</button>
</div>
<button class="reset" id="resetBtn">
🔄 Reset
</button>
<div class="section">
<label>
<span>Empfindlichkeit</span>
<span id="sensVal">2.0</span>
</label>
<label>
<span>Schwelle</span>
<span id="thrVal">18</span>
</label>
<label>
<span>Mindestabstand (ms)</span>
<span id="coolVal">120</span>
</label>
</div>
<div class="section">
<label>
<span>Mikrofonpegel</span>
<span id="volText">0</span>
</label>
<div class="meter-bg">
<div class="meter" id="meter"></div>
</div>
</div>
<div class="tip">
Beim ersten Start muss Safari nach der Mikrofonberechtigung fragen.
Wenn nichts passiert, prüfe:
Einstellungen → Safari → Mikrofon → Erlauben.
</div>
</div>
</div>
<script>
let audioContext;
let analyser;
let mic;
let dataArray;
let running=false;
let raf;
let count=0;
let lastHit=0;
let previous=0;
const countEl=document.getElementById("count");
const statusEl=document.getElementById("status");
const meter=document.getElementById("meter");
const volText=document.getElementById("volText");
const sens=document.getElementById("sens");
const thr=document.getElementById("thr");
const cool=document.getElementById("cool");
const sensVal=document.getElementById("sensVal");
const thrVal=document.getElementById("thrVal");
const coolVal=document.getElementById("coolVal");
const highscoreEl=document.getElementById("highscore");
let highscore=
parseInt(localStorage.getItem("tt_highscore")||"0");
highscoreEl.textContent=highscore;
function updateLabels(){
  sensVal.textContent=sens.value;
  thrVal.textContent=thr.value;
  coolVal.textContent=cool.value;
}
updateLabels();
sens.oninput=updateLabels;
thr.oninput=updateLabels;
cool.oninput=updateLabels;
async function start(){
  if(running) return;
  try{
    const stream=
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });
    audioContext=
      new(window.AudioContext||
      window.webkitAudioContext)();
    await audioContext.resume();
    analyser=
      audioContext.createAnalyser();
    analyser.fftSize=1024;
    mic=
      audioContext.createMediaStreamSource(stream);
    mic.connect(analyser);
    dataArray=
      new Uint8Array(analyser.frequencyBinCount);
    running=true;
    statusEl.textContent=
      "🎧 Mikrofon aktiv";
    detect();
  }catch(err){
    console.error(err);
    statusEl.textContent=
      "❌ Mikrofonzugriff fehlgeschlagen";
  }
}
function stop(){
  running=false;
  if(raf){
    cancelAnimationFrame(raf);
  }
  if(audioContext){
    audioContext.close();
  }
  statusEl.textContent="Gestoppt";
}
function detect(){
  if(!running) return;
  analyser.getByteFrequencyData(dataArray);
  let sum=0;
  for(let i=0;i<dataArray.length;i++){
    sum+=dataArray[i];
  }
  let volume=
    (sum/dataArray.length)*
    parseFloat(sens.value);
  volume=Math.min(volume,100);
  volText.textContent=
    Math.round(volume);
  meter.style.width=
    volume+"%";
  const threshold=
    parseFloat(thr.value);
  const cooldown=
    parseInt(cool.value);
  const now=Date.now();
  const hit=
    volume>threshold &&
    volume>(previous*1.15);
  if(hit && now-lastHit>cooldown){
    count++;
    countEl.textContent=count;
    if(count>highscore){
      highscore=count;
      localStorage.setItem(
        "tt_highscore",
        highscore
      );
      highscoreEl.textContent=
        highscore;
    }
    lastHit=now;
  }
  previous=volume;
  raf=requestAnimationFrame(detect);
}
document
.getElementById("startBtn")
.addEventListener("click",start);
document
.getElementById("stopBtn")
.addEventListener("click",stop);
document
.getElementById("resetBtn")
.addEventListener("click",()=>{
  count=0;
  countEl.textContent="0";
});
</script>
</body>
</html>
